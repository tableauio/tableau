name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (vX.Y.Z or cmd/tableauc/vX.Y.Z, optionally with a prerelease suffix)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    # Ignore releases for unrelated modules.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'cmd/tableauc/v')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify release tag matches version.go
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#cmd/tableauc/}"
          if [[ ! "$RELEASE_VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          TAG_VERSION="${BASH_REMATCH[1]}"
          SOURCE_VERSION=$(sed -nE 's/^const version = "([^"]+)".*/\1/p' version.go)
          if [ -z "$SOURCE_VERSION" ]; then
            echo "::error::Could not read version from version.go"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG has base version $TAG_VERSION, but version.go declares $SOURCE_VERSION"
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches version.go ($SOURCE_VERSION)"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "package-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Release tableauc
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Prepare build directory
        run: |
          mkdir -p build/tableau/protobuf/
          cp proto/tableau/protobuf/*.proto build/tableau/protobuf/
          cp README.md build/
          cp LICENSE build/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd cmd/tableauc
          CGO_ENABLED=0 go build -installsuffix cgo -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/build"

      - name: Create package
        id: package
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.package-version }}
        run: |
          PACKAGE_NAME=tableauc.${RELEASE_VERSION}.${{ matrix.goos }}.${{ matrix.goarch }}.tar.gz
          tar -czvf "$PACKAGE_NAME" -C build .
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_NAME" --repo "$GITHUB_REPOSITORY"
