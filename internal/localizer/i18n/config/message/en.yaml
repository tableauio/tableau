default: |
  {{ if .ErrCode }}error[{{.ErrCode}}]: {{.ErrDesc}}
  {{ end }}{{ if or .BookName .PrimaryBookName .BookAlias }}Workbook: {{source .BookName .PrimaryBookName "Primary" "Alias" .BookAlias}}
  {{ end }}{{ if or .SheetName .PrimarySheetName .SheetAlias .Merger .Scatter }}Worksheet: {{source .SheetName .PrimarySheetName "Primary" "Alias" .SheetAlias "Merger" .Merger "Scatter" .Scatter}}
  {{ end }}{{ if .ReferBookName }}ReferWorkbook: {{.ReferBookName}}
  ReferWorksheet: {{.ReferSheetName}}
  {{ end }}Reason: {{.Reason}}
  {{- if .Help }}
  Help: {{.Help}}
  {{- end }}
protogen: |
  error[{{.ErrCode}}]: {{.ErrDesc}}
  Workbook: {{source .BookName .PrimaryBookName "Primary" "Alias" .BookAlias}}
  Worksheet: {{source .SheetName .PrimarySheetName "Primary" "Alias" .SheetAlias "Merger" .Merger "Scatter" .Scatter}}
  NameCellPos: {{.NameCellPos}}
  NameCell: {{.NameCell}}
  TypeCellPos: {{.TypeCellPos}}
  TypeCell: {{.TypeCell}}
  Reason: {{.Reason}}
  {{- if .Help }}
  Help: {{.Help}}
  {{- end }}
confgen: |
  error[{{.ErrCode}}]: {{.ErrDesc}}
  Workbook: {{source .BookName .PrimaryBookName "Primary" "Alias" .BookAlias}}
  Worksheet: {{source .SheetName .PrimarySheetName "Primary" "Alias" .SheetAlias "Merger" .Merger "Scatter" .Scatter}}
  {{- if .ReferBookName }}
  ReferWorkbook: {{.ReferBookName}}
  ReferWorksheet: {{.ReferSheetName}}
  {{- end }}
  DataCellPos: {{.DataCellPos}}
  DataCell: {{.DataCell}}
  Reason: {{.Reason}}
  {{- if .Help }}
  Help: {{.Help}}
  {{- end }}
