default: |
  {{ if .ErrCode }}error[{{.ErrCode}}]: {{.ErrDesc}}
  {{ end }}{{ if or .BookName .PrimaryBookName .BookAlias }}工作簿: {{source .BookName .PrimaryBookName "主工作簿" "别名" .BookAlias}}
  {{ end }}{{ if or .SheetName .PrimarySheetName .SheetAlias .Merger .Scatter }}工作表: {{source .SheetName .PrimarySheetName "主工作表" "别名" .SheetAlias "合并" .Merger "散表" .Scatter}}
  {{ end }}{{ if .ReferBookName }}引用工作簿: {{.ReferBookName}}
  引用工作表: {{.ReferSheetName}}
  {{ end }}错误原因: {{.Reason}}
  {{- if .Help }}
  修复建议: {{.Help}}
  {{- end }}
protogen: |
  error[{{.ErrCode}}]: {{.ErrDesc}}
  工作簿: {{source .BookName .PrimaryBookName "主工作簿" "别名" .BookAlias}}
  工作表: {{source .SheetName .PrimarySheetName "主工作表" "别名" .SheetAlias "合并" .Merger "散表" .Scatter}}
  命名单元格位置: {{.NameCellPos}}
  命名单元格数据: {{.NameCell}}
  类型单元格位置: {{.TypeCellPos}}
  类型单元格数据: {{.TypeCell}}
  错误原因: {{.Reason}}
  {{ if .Help }}修复建议: {{.Help}}{{ end }}
confgen: |
  error[{{.ErrCode}}]: {{.ErrDesc}}
  工作簿: {{source .BookName .PrimaryBookName "主工作簿" "别名" .BookAlias}}
  工作表: {{source .SheetName .PrimarySheetName "主工作表" "别名" .SheetAlias "合并" .Merger "散表" .Scatter}}
  {{- if .ReferBookName }}
  引用工作簿: {{.ReferBookName}}
  引用工作表: {{.ReferSheetName}}
  {{- end }}
  单元格位置: {{.DataCellPos}}
  单元格数据: {{.DataCell}}
  错误原因: {{.Reason}}
  {{ if .Help }}修复建议: {{.Help}}{{ end }}
